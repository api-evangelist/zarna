name: Zarna
description: Zarna builds autonomous AI associates for private capital firms — private equity, growth
  equity, private credit, family offices, and investment banks. The platform captures deal information
  from CIMs, emails, meetings, CRMs, and virtual data rooms into a structured institutional memory, then
  runs a swarm of specialized agents (Scribe for capture and logging, Memo for screening memos and briefs,
  Analyst for mandate-fit scoring, and Experts for warm-intro network mapping) that deliver finished work
  directly into Outlook, Teams, and Slack. Zarna integrates with 30+ deal tools including DealCloud, Affinity,
  Salesforce, and SharePoint, deploys into VPC or on-premises single-tenant infrastructure, and is SOC
  2 Type II certified. A Y Combinator Fall 2025 company founded by an ex-AEA Investors team.
